name: Build Piko NewX KR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

concurrency:
  group: piko-newx-kr-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"
      - name: Prepare NewX-only source
        run: python3 .github/scripts/prepare_newx.py
      - name: Download reported emoji fonts
        env:
          EMOJI_FONT_DIR: ${{ runner.temp }}/emoji-fonts
        run: |
          mkdir -p "$EMOJI_FONT_DIR"
          curl -fL --retry 3 https://github.com/samuelngs/apple-emoji-ttf/releases/download/macos-26-20260722-484daf4e/AppleColorEmoji-Linux.ttf -o "$EMOJI_FONT_DIR/AppleColorEmoji-Linux.ttf"
          curl -fL --retry 3 https://raw.githubusercontent.com/n4bi10p/Ios-emoji/HEAD/system/fonts/NotoColorEmoji.ttf -o "$EMOJI_FONT_DIR/iOS-Emoji-Android.ttf"
          echo "e37c7af6265ac4a0af6d57bc65e86109a776d9966e8343334557f63da482516f  $EMOJI_FONT_DIR/AppleColorEmoji-Linux.ttf" | sha256sum -c
          echo "f06ab19cd58f6c42ee7e367205e54dd7931c1344b641b977a415a279cf11319f  $EMOJI_FONT_DIR/iOS-Emoji-Android.ttf" | sha256sum -c
      - name: Build patch bundle
        env:
          EMOJI_FONT_DIR: ${{ runner.temp }}/emoji-fonts
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:build buildAndroid :patches:lintNewxResolvers :extensions:newx:testDebugUnitTest --tests 'app.morphe.extension.newx.misc.EmojiFontRuntimeTest' --tests 'app.morphe.extension.newx.theme.DynamicColorPaletteTest' --tests 'app.morphe.extension.newx.ui.ThemeStyleResolutionTest' --no-daemon --console=plain
      - name: Upload emoji diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoji-diagnostics
          path: |
            ${{ runner.temp }}/emoji-fonts/*.png
            extensions/newx/build/test-results/
            extensions/newx/build/reports/tests/
      - name: Name custom patch bundle
        shell: bash
        run: |
          version=$(sed -n 's/^version = //p' gradle.properties)
          mkdir -p dist
          cp "patches/build/libs/patches-$version.mpp" "dist/piko-newx-kr-$version.mpp"
      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: piko-newx-kr
          path: dist/*.mpp
          if-no-files-found: error
      - name: Publish release
        if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[build-only]')"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = //p' gradle.properties)
          tag="v$version"
          artifact="dist/piko-newx-kr-$version.mpp"
          test -s "$artifact"
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("patches-bundle.json").read_text())
          upstream = json.loads(Path(".github/upstream.json").read_text())
          Path("dist/release-notes.md").write_text(
              metadata["description"] + "\n\n"
              + f"Upstream Piko NewX: {upstream['release']} ({upstream['commit']})\n"
              + f"Target X: {metadata['app_version']} APKM\n"
              + "Build and automated tests passed; device UI testing pending.\n"
          )
          PY
          gh release create "$tag" "$artifact" --target "$GITHUB_SHA" --title "Piko NewX KR $tag" --notes-file dist/release-notes.md --latest
      - name: Update Morphe source metadata
        if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[build-only]')"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/patches-bundle.json?ref=main" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/patches-bundle.json" --method PUT -f branch=main -f message="Update Korean NewX release metadata [skip ci]" -f sha="$sha" -f content="$(base64 -w0 patches-bundle.json)" --silent
